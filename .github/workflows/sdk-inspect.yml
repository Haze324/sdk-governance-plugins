name: SDK 巡检版本审计
on:
  schedule:
    - cron: '0 9 * * 1'        # 每周一早 9:00 自动巡检
  workflow_dispatch:             # Actions tab 手动触发
  issue_comment:                 # Issue 评论触发
    types: [created]

jobs:
  sdk-inspect:
    runs-on: ubuntu-latest
    # ----------------------------------------------------------
    #  仅当以下情况之一时运行：
    #    · 定时触发（schedule）
    #    · 手动触发（workflow_dispatch）
    #    · Issue 评论内容包含 "/sdk-inspect"
    # ----------------------------------------------------------
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '/sdk-inspect')
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 运行 SDK 巡检版本审计
        id: inspect
        run: npx ts-node src/inspect/main.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TRIGGER_SOURCE: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ISSUE_URL: ${{ github.event.issue.html_url }}

      - name: 部署报告到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
