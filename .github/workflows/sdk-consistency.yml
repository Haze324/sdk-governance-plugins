name: SDK 一致性检测（上游对比）
on:
  schedule:
    - cron: '0 10 * * 1'        # 每周一早 10:00 自动检测
  workflow_dispatch:              # Actions tab 手动触发
  issue_comment:                  # Issue 评论触发
    types: [created]

jobs:
  sdk-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: 判断触发条件
        id: check
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "触发方式：$EVENT_NAME → 执行一致性检测"
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "comment_body=" >> $GITHUB_OUTPUT
            echo "issue_url=" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            COMMENT=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")
            ISSUE_URL=$(jq -r '.issue.html_url // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")

            if echo "$COMMENT" | grep -q "/sdk-consistency"; then
              echo "触发方式：Issue 评论指令 → 执行一致性检测"
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "跳过：评论不含 /sdk-consistency 指令"
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
            # 多行值用 heredoc 安全写入 GITHUB_OUTPUT，避免换行截断
            echo "comment_body<<COMMENT_EOF" >> $GITHUB_OUTPUT
            echo "$COMMENT" >> $GITHUB_OUTPUT
            echo "COMMENT_EOF" >> $GITHUB_OUTPUT
            echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
          else
            echo "跳过：未知触发来源"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.should_run == 'true'

      - name: 安装 Node.js
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        if: steps.check.outputs.should_run == 'true'
        run: npm install

      - name: 运行 SDK 一致性检测
        if: steps.check.outputs.should_run == 'true'
        id: consistency
        run: npx ts-node src/consistency/main.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TRIGGER_SOURCE: ${{ github.event_name }}
          COMMENT_BODY: ${{ steps.check.outputs.comment_body }}
          COMMENT_ISSUE_URL: ${{ steps.check.outputs.issue_url }}

      - name: 部署报告到 GitHub Pages
        if: steps.check.outputs.should_run == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
