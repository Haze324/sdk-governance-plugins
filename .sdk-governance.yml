# ============================================================
#  SDK 治理插件 — 配置文件
#  仓库根目录：.sdk-governance.yml
# ============================================================

# ----------------------------------------------------------
#  巡检插件配置 — SDK 巡检版本审计
# ----------------------------------------------------------
inspect:
  # 定时巡检 cron 表达式（GitHub Actions schedule 语法）
  cron: "0 9 * * 1"

  # 私有 ohpm registry 地址（不填走开源 registry）
  registry: ""

  # 排除的 SDK 列表，巡检跳过这些 SDK
  exclude:
    - internal-test-sdk

# ----------------------------------------------------------
#  一致性插件配置 — 上游 vs 鸿蒙对比
# ----------------------------------------------------------
consistency:
  # 上游安卓 SDK 数据来源
  sources:
    - sdk: "pay-sdk"
      maven: "com.example:pay-sdk:2.0.0"
    - sdk: "map-sdk"
      source: "https://github.com/example/map-sdk"

  # 要检测的鸿蒙包列表
  targets:
    - name: "@ohos/pay-sdk"
    - name: "@ohos/map-sdk"
